<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Baby Care</title>

    <!-- Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <!-- ==================== NAVBAR ==================== -->
    <header class="site-header login-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container navbar-container">

                <a class="navbar-brand" href="index.html">
                    <img src="../assets/icons/logo.png"
                         alt="Baby Care Logo"
                         class="logo">
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavbar"
                        aria-controls="mainNavbar"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>

                        <li class="nav-item nav-divider d-none d-lg-block"></li>

                        <li class="nav-item">
                            <a class="btn btn-login active-login" href="login.html">
                                Login
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="btn btn-register" href="register.php">
                                Register
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>


    <!-- ==================== LOGIN AREA ==================== -->
    <main class="login-main">

        <!-- Decorative elements -->
        <span class="login-cloud cloud-one"></span>
        <span class="login-cloud cloud-two"></span>
        <span class="login-heart heart-one">♥</span>
        <span class="login-heart heart-two">♥</span>

        <div class="login-decoration decoration-one">
            <span>☆</span>
            <span>☆</span>
            <span>☆</span>
            <div></div>
        </div>

        <div class="container login-container">

            <div class="login-card">

                <!-- Logo -->
                <div class="login-card-logo">
                    <img src="../assets/icons/logo.png"
                         alt="Baby Care Logo">
                </div>

                <!-- Heading -->
                <div class="login-heading">
                    <h1>Welcome Back!</h1>
                    <p>Log in to continue your journey</p>
                </div>

                <!-- Form -->
                <form action="../php/auth/login.php" method="post">

                    <div class="login-field">
                        <label for="email">Email</label>

                        <div class="input-wrapper">
                            <span class="input-icon">@</span>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   placeholder="Enter your email"
                                   autocomplete="email"
                                   required>
                        </div>
                    </div>


                    <div class="login-field">
                        <label for="password">Password</label>

                        <div class="input-wrapper">
                            <span class="input-icon">⌕</span>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   placeholder="Enter your password"
                                   autocomplete="current-password"
                                   required>

                            <button type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    aria-label="Show password">
                                ◉
                            </button>
                        </div>
                    </div>


                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot Password?
                        </a>
                    </div>


                    <button type="submit" class="login-submit">
                        Login
                    </button>

                </form>


                <p class="register-prompt">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

            </div>

        </div>
    </main>


    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");

        passwordToggle.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            passwordToggle.textContent = isPassword ? "◉" : "◉";
            passwordToggle.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>

</body>
</html>
